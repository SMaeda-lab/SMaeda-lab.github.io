name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["gh-pages"] # 正しいブランチ名（master）に合わせています
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7'
          bundler-cache: true
          cache-version: 1

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # ↓ここ：シンボリックリンクを完全に排除し、安全な別フォルダ（./_dist）に実体ファイルとしてコピーします
      - name: Flatten and copy artifact
        run: |
          mkdir -p ./_dist
          cp -rL ./_site/* ./_dist/
          rm -rf ./_dist/.jekyll-cache ./_dist/.sass-cache

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ./_dist # アップロードする対象を、リンクのない綺麗なフォルダ（_dist）に変更します

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
