name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["gh-pages"] # あなたのメインブランチ名（masterならmasterに変更）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Node.js 24への強制実行警告を消したい場合は以下を追記
        with:
          actions-node-version: '24'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3' # 必要に応じて使用しているRubyのバージョンに合わせてください
          bundler-cache: true
          cache-version: 1

      - name: Build with Jekyll
        # Gemfileの依存関係エラーを回避しつつビルドします
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          actions-node-version: '24' # Node.js警告対策
          name: github-pages
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
